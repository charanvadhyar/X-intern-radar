<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Intern Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161716;--panel:#1b1c1b;--raise:#222322;--line:#2d2e2d;--text:#ededed;--muted:#a1a3a1;--faint:#6f716f;
  --accent:#3b82f6;--accent-soft:rgba(59,130,246,.14);--good:#34d399;--good-soft:rgba(52,211,153,.12);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);--code:#121312;--btn2:#ededed;--btn2-text:#161716;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f7f7f6;--panel:#ffffff;--raise:#f2f2f1;--line:#e4e4e2;--text:#161716;--muted:#5f615f;--faint:#9a9c9a;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.09);--good:#059669;--good-soft:rgba(5,150,105,.1);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.1);--code:#f6f6f5;--btn2:#161716;--btn2-text:#ffffff;}}
:root[data-theme="light"]{
  --bg:#f7f7f6;--panel:#ffffff;--raise:#f2f2f1;--line:#e4e4e2;--text:#161716;--muted:#5f615f;--faint:#9a9c9a;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.09);--good:#059669;--good-soft:rgba(5,150,105,.1);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.1);--code:#f6f6f5;--btn2:#161716;--btn2-text:#ffffff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 72px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center;font:700 14px "Schibsted Grotesk",sans-serif}
.navr{display:flex;gap:8px;align-items:center}
.icon{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px}
.icon:hover{color:var(--text)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;margin-bottom:16px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--raise);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
h1{font:700 clamp(28px,5vw,42px)/1.1 "Schibsted Grotesk",sans-serif;letter-spacing:-.02em;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.stat{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:700 22px "Schibsted Grotesk",sans-serif}
.stat small{color:var(--muted);font-size:12px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0 12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;font:500 13px "Geist",sans-serif}
.tab.on{background:var(--raise);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.tab i{font-style:normal;color:var(--faint);margin-left:4px}
.find{display:flex;gap:8px;flex:1;min-width:240px;justify-content:flex-end}
.find input,.find select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;min-width:0}
.find input{flex:1;max-width:320px}
.find input:focus,.find select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.listhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}
.listhead span{color:var(--muted);font-weight:400}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.skipped{opacity:.5}
.rowmain{display:flex;gap:14px;align-items:center;padding:14px 18px;cursor:pointer;width:100%;background:none;border:0;color:inherit;text-align:left;font:inherit}
.rowmain:hover{background:var(--raise)}
.av{flex:none;width:40px;height:40px;border-radius:10px;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font:700 16px "Schibsted Grotesk",sans-serif;color:var(--text)}
.item.applied .av{background:var(--good-soft);color:var(--good);border-color:transparent}
.info{flex:1;min-width:0}
.title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{flex:none;text-align:right}
.fit{font-weight:600;font-size:13px;color:var(--accent)}
.fit.hi{color:var(--good)}.fit.mid{color:var(--warn)}
.ago{color:var(--faint);font-size:12px}
.chev{flex:none;color:var(--faint);transition:transform .15s}
.item.open .chev{transform:rotate(90deg)}
.detail{display:none;padding:0 18px 18px 72px}
.item.open .detail{display:block}
.why{color:var(--muted);margin:0 0 10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;background:var(--raise)}
a.chip{color:var(--text)}
a.chip:hover{border-color:var(--accent)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:14px 0 6px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);padding:14px;border-radius:12px;font:13.5px/1.6 "Geist",ui-sans-serif,system-ui,sans-serif;margin:0;color:var(--text)}
.subj{font-weight:600;margin-bottom:6px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{border:1px solid var(--line);background:var(--raise);color:var(--text);padding:8px 16px;border-radius:999px;cursor:pointer;font:500 13px "Geist",sans-serif}
.b:hover{border-color:var(--faint)}
.b.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.b.w{background:var(--btn2);color:var(--btn2-text);border-color:var(--btn2)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:12px}
details pre{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.gate{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;max-width:560px;margin:0 auto}
.gate h2{font:700 24px "Schibsted Grotesk",sans-serif;margin:0 0 8px;letter-spacing:-.01em}
.gate ol{padding-left:20px;color:var(--muted);font-size:14px}
.gate a{color:var(--accent)}
.gate code{background:var(--raise);padding:1px 6px;border-radius:6px}
.gate input{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--text);font:inherit;margin:10px 0}
.err{color:#f87171;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--btn2);color:var(--btn2-text);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.detail{padding:0 16px 16px}.find{justify-content:stretch}.find input{max-width:none}.rowmain{padding:14px 16px}.chev{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><div class="logo">R</div>Intern Radar</div>
    <div class="navr">
      <button class="icon" id="theme" title="Toggle theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon" id="refresh" title="Refresh">↻</button>
      <button class="b" id="logout" hidden>Forget token</button>
    </div>
  </nav>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---- Settings: where the data lives ---------------------------------------
const REPO = "charanvadhyar/X-intern-radar";   // private repo holding data/
const DATA_PATH = "data/opportunities.jsonl";
const PUBLIC_DATA = "data.json";                // optional, same folder as this page
// ---------------------------------------------------------------------------

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v);}catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
let items = [], filter = "new", query = "", sort = "newest";
const status = store.get("radar.status", {});

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"), 1600); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safeUrl(u){ try{ const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; }catch{ return null; } }

function parseJsonl(text){
  return text.split("\n").filter(l => l.trim()).map(l => { try{ return JSON.parse(l); }catch{ return null; } }).filter(Boolean);
}

async function loadPublic(){
  try{
    const r = await fetch(PUBLIC_DATA, {cache:"no-store"});
    if(!r.ok) return null;
    const j = await r.json();
    return Array.isArray(j) ? j : null;
  }catch{ return null; }
}

async function loadPrivate(token){
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`, {
    headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.raw+json" }, cache: "no-store"
  });
  if(r.status === 404) return [];             // no opportunities file yet
  if(r.status === 401 || r.status === 403) throw new Error("GitHub refused this token. Check it has read access to the repo's contents.");
  if(!r.ok) throw new Error(`GitHub returned ${r.status}.`);
  return parseJsonl(await r.text());
}

async function load(){
  $("#app").innerHTML = '<div class="empty">Loading…</div>';
  const pub = await loadPublic();
  if(pub){ items = pub; $("#logout").hidden = true; return render(); }
  const token = store.get("radar.token", "");
  if(!token) return gate();
  try{
    items = await loadPrivate(token);
    $("#logout").hidden = false;
    render();
  }catch(e){ gate(e.message); }
}

function gate(err){
  $("#logout").hidden = true;
  $("#app").innerHTML = `
    <div class="gate">
      <h2>Connect your private data</h2>
      <p class="sub">This page is public, but your opportunities and drafts stay in your private repo. Paste a read-only GitHub token once and it's kept only in this browser.</p>
      <ol class="sub">
        <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained tokens → Generate new token</a>.</li>
        <li>Repository access: <b>Only select repositories</b> → <code>${esc(REPO.split("/")[1])}</code>.</li>
        <li>Permissions: <b>Contents → Read-only</b>. Nothing else.</li>
      </ol>
      <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <div class="row"><button class="b p" id="save">Load my opportunities</button></div>
    </div>`;
  $("#save").onclick = () => { const v = $("#tok").value.trim(); if(!v) return; store.set("radar.token", v); load(); };
  $("#tok").onkeydown = e => { if(e.key === "Enter") $("#save").click(); };
}

function keyOf(it){ return it.post?.id || it.post?.link || JSON.stringify(it).slice(0,80); }
function stateOf(it){ return status[keyOf(it)] || "new"; }
function setState(it, s){ const k = keyOf(it); if(s === "new") delete status[k]; else status[k] = s; store.set("radar.status", status); render(); }

const open = new Set();
function ago(found){
  const t = Date.parse(String(found||"").replace(" UTC","Z").replace(" ","T"));
  if(!t) return "";
  const m = Math.max(0, Math.round((Date.now()-t)/60000));
  if(m < 60) return `${m} min ago`;
  const h = Math.round(m/60); if(h < 24) return `${h} hr ago`;
  const d = Math.round(h/24); return `${d} day${d>1?"s":""} ago`;
}

function render(){
  const byKey = new Map(); items.forEach(it => byKey.set(keyOf(it), it));
  const all = [...byKey.values()];
  const counts = {new:0, applied:0, skipped:0};
  all.forEach(it => counts[stateOf(it)]++);
  const week = Date.now() - 7*864e5;
  const recent = all.filter(it => Date.parse(String(it.found_at||"").replace(" UTC","Z").replace(" ","T")) > week).length;
  const latest = all.map(it => it.found_at).filter(Boolean).sort().pop();

  let list = all.filter(it => filter === "all" || stateOf(it) === filter);
  if(query){
    const q = query.toLowerCase();
    list = list.filter(it => JSON.stringify([it.verdict, it.post?.text, it.post?.author_username]).toLowerCase().includes(q));
  }
  list.sort((a,b) => sort === "fit"
    ? (b.verdict?.relevance||0) - (a.verdict?.relevance||0)
    : String(b.found_at||"").localeCompare(String(a.found_at||"")));
  const tabName = {new:"To review", applied:"Applied", skipped:"Skipped", all:"All opportunities"}[filter];

  $("#app").innerHTML = `
    <section class="hero">
      <div class="live"><span class="dot"></span>${latest ? `Last find ${esc(ago(latest))}` : "Watching X every 6 hours"}</div>
      <h1>Your next internship,<br>found before it trends.</h1>
      <div class="sub">Startup roles spotted on X, screened against your profile, with an email and DM ready to send.</div>
      <div class="stats">
        <div class="stat"><b>${counts.new}</b><small>To review</small></div>
        <div class="stat"><b>${recent}</b><small>Found this week</small></div>
        <div class="stat"><b>${counts.applied}</b><small>Applied</small></div>
        <div class="stat"><b>${all.length}</b><small>All time</small></div>
      </div>
    </section>
    <div class="tools">
      <div class="seg">
        ${[["new","To review"],["applied","Applied"],["skipped","Skipped"],["all","All"]].map(([k,l]) =>
          `<button class="tab${filter===k?" on":""}" data-f="${k}">${l}${k!=="all"?`<i>${counts[k]}</i>`:""}</button>`).join("")}
      </div>
      <div class="find">
        <input id="q" placeholder="Search company, role, skill" value="${esc(query)}">
        <select id="sort">
          <option value="newest"${sort==="newest"?" selected":""}>Newest</option>
          <option value="fit"${sort==="fit"?" selected":""}>Best fit</option>
        </select>
      </div>
    </div>
    <section class="list">
      <div class="listhead"><div><span class="dot" style="display:inline-block;margin-right:8px"></span>${tabName}</div><span>${list.length} shown</span></div>
      ${list.length ? list.map(card).join("") : `<div class="empty">${all.length ? "Nothing here." : "No opportunities yet. The radar checks X every 6 hours."}</div>`}
    </section>`;

  $("#q").oninput = e => { query = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos,pos); };
  $("#sort").onchange = e => { sort = e.target.value; render(); };
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
  document.querySelectorAll(".rowmain").forEach(b => b.onclick = () => {
    const k = b.dataset.k; open.has(k) ? open.delete(k) : open.add(k);
    b.parentElement.classList.toggle("open"); b.setAttribute("aria-expanded", open.has(k));
  });
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, list[+b.dataset.i]));
}

function card(it, i){
  const v = it.verdict || {}, p = it.post || {}, o = it.outreach || {};
  const st = stateOf(it), fit = v.relevance ?? 0, k = keyOf(it);
  const title = v.role || "Opportunity";
  const org = v.company || "@" + (p.author_username || "unknown");
  const initial = (v.company || p.author_username || "?").trim().charAt(0).toUpperCase();
  const link = safeUrl(p.link), apply = safeUrl(v.apply_link);
  const contact = v.contact_email ? `✉ ${esc(v.contact_email)}` : v.contact_method === "dm" ? "DM on X" : esc(v.contact_method || "");
  const isOpen = open.has(k);
  return `
  <div class="item ${st}${isOpen?" open":""}">
    <button class="rowmain" data-k="${esc(k)}" aria-expanded="${isOpen}">
      <div class="av">${esc(initial)}</div>
      <div class="info">
        <div class="title">${esc(title)}</div>
        <div class="meta">${esc(org)}${v.location ? " · " + esc(v.location) : ""}${st!=="new" ? " · " + st : ""}</div>
      </div>
      <div class="side">
        <div class="fit ${fit>=8?"hi":fit>=6?"mid":""}">Fit ${fit}/10</div>
        <div class="ago">${esc(ago(it.found_at))}</div>
      </div>
      <span class="chev">›</span>
    </button>
    <div class="detail">
      <p class="why">${esc(v.reason)}</p>
      <div class="chips">
        ${link ? `<a class="chip" href="${esc(link)}" target="_blank" rel="noopener">View post ↗</a>` : ""}
        ${apply ? `<a class="chip" href="${esc(apply)}" target="_blank" rel="noopener">Apply link ↗</a>` : ""}
        ${contact ? `<span class="chip">${contact}</span>` : ""}
        <span class="chip">@${esc(p.author_username)}</span>
        ${it.gmail_draft ? `<span class="chip">In Gmail drafts</span>` : ""}
      </div>
      ${o.email_body ? `
        <div class="label">Email</div>
        <div class="subj">${esc(o.email_subject)}</div>
        <pre>${esc(o.email_body)}</pre>
        <div class="btns">
          <button class="b w" data-act="copy-email" data-i="${i}">Copy email</button>
          ${v.contact_email ? `<button class="b" data-act="mail" data-i="${i}">Open in mail app</button>` : ""}
        </div>
        <div class="label">DM</div>
        <pre>${esc(o.dm_text)}</pre>
        <div class="btns"><button class="b w" data-act="copy-dm" data-i="${i}">Copy DM</button></div>` : ""}
      <details><summary>Original post</summary><pre>${esc(p.text)}</pre></details>
      <div class="btns" style="margin-top:16px">
        ${st!=="applied" ? `<button class="b p" data-act="applied" data-i="${i}">Mark applied</button>` : ""}
        ${st!=="skipped" ? `<button class="b" data-act="skipped" data-i="${i}">Skip</button>` : ""}
        ${st!=="new" ? `<button class="b" data-act="new" data-i="${i}">Back to review</button>` : ""}
      </div>
    </div>
  </div>`;
}

async function copy(text, label){
  try{ await navigator.clipboard.writeText(text); toast(`${label} copied`); }
  catch{ toast("Couldn't copy. Select the text instead."); }
}

function act(a, it){
  const o = it.outreach || {}, v = it.verdict || {};
  if(a === "copy-email") return copy(`Subject: ${o.email_subject}\n\n${o.email_body}`, "Email");
  if(a === "copy-dm") return copy(o.dm_text, "DM");
  if(a === "mail") { location.href = `mailto:${encodeURIComponent(v.contact_email)}?subject=${encodeURIComponent(o.email_subject)}&body=${encodeURIComponent(o.email_body)}`; return; }
  setState(it, a);
}

$("#refresh").onclick = load;
const savedTheme = store.get("radar.theme", null);
if(savedTheme) document.documentElement.dataset.theme = savedTheme;
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("radar.theme", next);
};
$("#logout").onclick = () => { store.del("radar.token"); items = []; gate(); };
load();
</script>
</body>
