# X searches to run each time. X recent-search syntax:
# https://docs.x.com/x-api/posts/search/integrate/build-a-query
# Every post returned costs about $0.005, so keep these focused.
queries:
  - '(hiring OR "looking for" OR "we need") (intern OR interns OR internship) (startup OR seed OR YC OR "pre-seed" OR founding) -is:retweet -is:reply lang:en'
  - '("founding engineer" OR "founding intern" OR "engineering intern") ("DM me" OR "dm" OR "email" OR "reach out" OR "apply") -is:retweet -is:reply lang:en'
  - '(intern OR internship) (AI OR ML OR LLM OR Rust OR backend OR systems) ("we''re hiring" OR "is hiring" OR "join us") -is:retweet -is:reply lang:en'

# Posts per query per run (X allows 10 to 100).
max_results_per_query: 20

# Hard stop for X reads in one calendar month (about $0.005 each).
# 4000 posts is about $20. The run skips X once this is reached.
monthly_post_budget: 4000

# Posts scoring below this (0 to 10) are dropped before drafting.
min_relevance: 6

# Claude model. Classification runs in batches; drafting only for matches.
model: claude-opus-5-5
classify_batch_size: 20
