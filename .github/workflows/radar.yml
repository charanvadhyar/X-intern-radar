name: X intern radar

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      sample:
        description: "Test run on saved sample posts (no X API cost)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Scan, screen and draft
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.sample }}" = "true" ]; then
            python -m radar.main --sample tests/sample_posts.json --state /tmp/sample_state.json
          else
            python -m radar.main
          fi

      - name: Notify (opens an issue, which GitHub emails you)
        if: ${{ always() && hashFiles('data/latest_digest.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(grep -c '^### ' data/latest_digest.md || true)
          PREFIX=""; [ "${{ inputs.sample }}" = "true" ] && PREFIX="[TEST, not real] "
          gh issue create --title "${PREFIX}🎯 ${COUNT} new opportunities ($(date -u +%b\ %d,\ %H:%M) UTC)" --body-file data/latest_digest.md

      - name: Save state and digests
        if: ${{ always() && inputs.sample != true }}
        run: |
          git config user.name "intern-radar-bot"
          git config user.email "intern-radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "radar: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --no-edit origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
